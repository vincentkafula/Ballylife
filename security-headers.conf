# Security headers for every storefront response. Included in each nginx
# location block, because a location that sets any add_header of its own
# stops inheriting the server-level ones.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Content-Security-Policy. Sources are exactly what the app loads:
#  - scripts: our bundle, Google sign-in, Facebook SDK. 'unsafe-inline' is
#    still needed for the small inline scripts inside the policy pages
#    (TermsPage, AdvertisingPage, ...), which render as srcdoc iframes and
#    inherit this policy; moving those scripts out would allow dropping it.
#  - connect: our API (Railway / ballylife.com), including its websocket.
#  - img: product photos are served by our API's /media proxy; seller and
#    marketing images can come from any https host.
#  - frames: Google Maps embed (Contact page), Google/Facebook sign-in.
#  - form-action: PayFast's hosted payment pages.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.up.railway.app wss://*.up.railway.app https://*.ballylife.com wss://*.ballylife.com https://accounts.google.com https://*.facebook.com; frame-src 'self' https://www.google.com https://accounts.google.com https://*.facebook.com; form-action 'self' https://*.payfast.co.za; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
